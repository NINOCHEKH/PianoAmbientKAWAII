<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air.exe · Дрейф</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Share Tech Mono и Saira — латиница, PT Mono и PT Sans Narrow подхватывают кириллицу -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Share+Tech+Mono&family=PT+Mono&family=PT+Sans+Narrow:wght@400;700&display=swap">

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">

  <!-- Порядок важен: звук → музыкальные данные → движок → интерфейс -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" defer></script>
  <script src="music.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="sky.js" defer></script>
</head>
<body>
  <!-- Логотип Air.exe: один раз описан здесь, дальше подключается через <use> -->

  </svg>

  <!-- Небо: три слоя облаков плывут с разной скоростью, между ними мерцают звёздочки (рисует sky.js) -->
  <div class="sky" aria-hidden="true">
    <span class="sky__layer sky__layer--far"></span>
    <span class="sky__layer sky__layer--mid"></span>
    <span class="sky__sparkles"></span>
    <span class="sky__layer sky__layer--near"></span>
  </div>

  <main class="window" id="win">

    <!-- Заголовок окна -->
    <header class="titlebar">
      <span class="titlebar__title">— <svg class="titlebar__logo" role="img" aria-label="Air.exe"><use href="#logoAir"/></svg> · <span id="titleName">ДРЕЙФ</span> —</span>
      <span class="titlebar__line" aria-hidden="true"></span>
      <div class="titlebar__buttons">
        <button class="win-btn" id="btnMin" aria-label="Свернуть ручки тембра">
          <svg viewBox="0 0 14 14"><rect x="2" y="10" width="10" height="2.5" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="btnMax" aria-label="Растянуть окно">
          <svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="2" y="2" width="10" height="3" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="btnClose" aria-label="Выключить">
          <svg viewBox="0 0 14 14"><path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Меню -->
    <nav class="menubar" id="menubar" aria-label="Меню">
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>Ф</u>айл</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitem" data-action="play">Играть / стоп</button>
          <button class="menu__item" role="menuitem" data-action="restart">Начать цикл заново</button>
          <button class="menu__item" role="menuitem" data-action="record">Записать / закончить запись</button>
          <button class="menu__item" role="menuitem" data-action="rename">Переименовать трек…</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="power">Выключить</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>Г</u>олоса</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitem" data-action="all-on">Включить все</button>
          <button class="menu__item" role="menuitem" data-action="all-off">Выключить все</button>
          <button class="menu__item" role="menuitem" data-action="solo-off">Снять Solo</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="originals">Вернуть исходные рисунки</button>
          <button class="menu__item" role="menuitem" data-action="sound-reset">Сбросить громкость и тембр</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>В</u>ид</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitemcheckbox" data-action="compact" data-check="knobs">Ручки тембра</button>
          <button class="menu__item" role="menuitemcheckbox" data-action="wide" data-check="wide">Широкое окно</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>С</u>правка</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitem" data-action="help">Как играть</button>
          <button class="menu__item" role="menuitem" data-action="about">О Дрейфе</button>
        </div>
      </div>
    </nav>

    <div class="window__body">

      <!-- Общий транспорт и главный дисплей -->
      <section class="deck">
        <div class="panel deck__transport" aria-label="Транспорт">
          <div class="transport">
            <button class="tbtn" id="playBtn" aria-label="Играть">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><polygon points="6,3 21,12 6,21" fill="#2e6fd6" stroke="#174a9e" stroke-width="1"/></svg></span>
            </button>
            <button class="tbtn" id="stopBtn" aria-label="Стоп">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="#1b2738"/></svg></span>
            </button>
            <button class="tbtn tbtn--rec" id="recBtn" aria-label="Запись" aria-pressed="false">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#e0402a" stroke="#9e2414" stroke-width="1"/></svg></span>
            </button>
            <div class="knob-group">
              <div class="knob knob--medium" id="tempoKnob"></div>
              <span class="knob-group__label">ТЕМП</span>
            </div>
          </div>
        </div>

        <section class="lcd" aria-label="Дисплей">
          <div class="lcd__song">
            <div class="lcd-legend">ТРЕК <span class="lcd-rec" id="recInfo" hidden>● REC <b id="recTime">0:00</b></span><span class="lcd-legend__hint">✎ клик — переименовать</span></div>
            <button class="lcd__name" id="trackName" aria-label="Название трека — нажми, чтобы переименовать">ДРЕЙФ</button>
            <input class="lcd__name lcd__name-input" id="trackInput" maxlength="18" spellcheck="false" aria-label="Новое название трека" hidden>
          </div>
          <div class="lcd__viz">
            <canvas class="lcd__canvas" id="viz" aria-hidden="true"></canvas>
          </div>
          <div class="lcd__bpm">
            <div class="lcd-legend">BPM</div>
            <div class="lcd__bpm-row">
              <button class="lcd-arrow" id="bpmDown" aria-label="Медленнее">
                <svg viewBox="0 0 16 18"><polygon points="14,1 14,17 2,9"/></svg>
              </button>
              <div class="lcd__bpm-value" id="bpm">92</div>
              <button class="lcd-arrow" id="bpmUp" aria-label="Быстрее">
                <svg viewBox="0 0 16 18"><polygon points="2,1 2,17 14,9"/></svg>
              </button>
            </div>
          </div>

          <p class="lcd__status" id="status" role="status" aria-live="polite">Нажми ▶</p>

          <div class="lcd__info">
            <span class="lcd-pair"><span class="lcd-label">ТАКТ</span>
              <ol class="lcd-bars" id="bars" aria-label="Такт цикла"><li>1</li><li>2</li><li>3</li><li>4</li></ol></span>
            <span class="lcd-pair"><span class="lcd-label">АККОРД</span><span class="lcd-field lcd-field--short" id="chord">Em9</span></span>
            <span class="lcd-pair"><span class="lcd-label">KEY</span><span class="lcd-field" id="key">E MINOR</span></span>
            <span class="lcd-pair"><span class="lcd-label">ГОЛОСА</span><span class="lcd-chip" id="voices">1/6</span></span>
          </div>
          <div class="lcd__meta">
            <span class="lcd-label">OUT</span>
            <span class="led-meter" id="meter" aria-hidden="true"></span>
          </div>
        </section>
      </section>

      <!-- Шесть голосов, у каждого свой пульт (собираются из шаблона ниже) -->
      <div class="consoles" id="consoles"></div>

    </div>

    <!-- Выключенное окно -->
    <div class="power">
      <button class="power__btn" id="powerOn"><span>ВКЛ</span></button>
    </div>
  </main>

  <!-- Пульт одного голоса -->
  <template id="consoleTemplate">
    <section class="console">
      <div class="screen" data-ref="screen">
        <div class="screen__top">
          <b class="screen__badge" data-ref="num">1</b>
          <h2 class="screen__name" data-ref="name">ГОЛОС</h2>
          <span class="screen__state" data-ref="state">OFF</span>
        </div>
        <div class="screen__fields">
          <span class="screen__role" data-ref="role"></span>
          <span class="lcd-field lcd-field--pattern" data-ref="pattern">A · …</span>
        </div>
        <div class="steps" data-ref="steps" aria-hidden="true"></div>
        <p class="screen__note" data-ref="note"></p>
      </div>

      <div class="console__keys">
        <button class="power-key" data-ref="power" aria-pressed="false">
          <span class="power-key__disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 V11 M7 6.5 A7.5 7.5 0 1 0 17 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        </button>
        <button class="pill pill--solo" data-ref="solo" aria-pressed="false">SOLO</button>
        <div class="pattern-keys" data-ref="patterns" role="group" aria-label="Паттерн"></div>
      </div>

      <div class="panel console__sound">
        <h3 class="panel__title">ЗВУК</h3>
        <div class="sound">
          <div class="fader-group">
            <div class="vfader" data-ref="volume"></div>
            <span class="fader-group__label">ГРОМК</span>
            <output class="readout" data-ref="volumeValue">80%</output>
          </div>
          <div class="sound__knobs" data-ref="knobs"></div>
          <div class="sound__vary">
            <button class="pill pill--wide" data-ref="vary">↻ ВАРИАЦИЯ</button>
            <button class="pill pill--wide" data-ref="reset" disabled>⟲ ИСХОДНЫЙ</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- Справка -->
  <dialog class="dialog" id="dlg">
    <div class="dialog__title">
      <span id="dlgTitle">СПРАВКА</span>
      <button class="win-btn" id="dlgX" aria-label="Закрыть">
        <svg viewBox="0 0 14 14"><path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog__body" id="dlgBody"></div>
    <div class="dialog__foot"><button class="pill" id="dlgOk">OK</button></div>
  </dialog>
</body>
</html>
