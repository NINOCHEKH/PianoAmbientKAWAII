<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synth Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap">

  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="window" id="win">

    <!-- Title bar -->
    <header class="titlebar">
      <svg class="titlebar__icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="1" y="2" width="22" height="20" rx="3" fill="#e8eef7"/>
        <rect x="3" y="11" width="18" height="9" fill="#fff" stroke="#1b2738"/>
        <g fill="#1b2738"><rect x="6" y="11" width="2" height="5"/><rect x="10" y="11" width="2" height="5"/><rect x="15" y="11" width="2" height="5"/></g>
        <path d="M4 8 L9 4 L14 7 L20 3" stroke="#2e6fd6" stroke-width="1.8" fill="none"/>
      </svg>
      <span class="titlebar__title">— SYNTH PLAYER —</span>
      <span class="titlebar__line" aria-hidden="true"></span>
      <div class="titlebar__buttons">
        <button class="win-btn" id="btnMin" aria-label="Свернуть панели">
          <svg viewBox="0 0 14 14"><rect x="2" y="10" width="10" height="2.5" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="btnMax" aria-label="Растянуть окно">
          <svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="2" y="2" width="10" height="3" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="btnClose" aria-label="Выключить">
          <svg viewBox="0 0 14 14"><path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <!-- Menu bar -->
    <nav class="menubar" id="menubar" aria-label="Меню">
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>F</u>ile</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitem" data-action="init">New patch</button>
          <button class="menu__item" role="menuitem" data-action="openSong">Open MIDI song…</button>
          <button class="menu__item" role="menuitem" data-action="panic">Stop all notes</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="power">Power off</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>P</u>reset</button>
        <div class="menu__list" role="menu" id="presetMenu"></div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>O</u>ptions</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitemradio" data-action="edit" data-arg="0" data-check="edit-0">Edit synth A</button>
          <button class="menu__item" role="menuitemradio" data-action="edit" data-arg="1" data-check="edit-1">Edit synth B</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="copy">Copy edited synth to the other</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="octDown">Octave down <span class="menu__hint">←</span></button>
          <button class="menu__item" role="menuitem" data-action="octUp">Octave up <span class="menu__hint">→</span></button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitem" data-action="midi">Connect MIDI keyboard</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>V</u>iew</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitemcheckbox" data-action="labels" data-check="labels">Key labels</button>
          <button class="menu__item" role="menuitemcheckbox" data-action="rack" data-check="rack">FX rack</button>
          <div class="menu__sep"></div>
          <button class="menu__item" role="menuitemradio" data-action="viz" data-arg="spectrum" data-check="viz-spectrum">Spectrum display</button>
          <button class="menu__item" role="menuitemradio" data-action="viz" data-arg="wave" data-check="viz-wave">Waveform display</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu__button" aria-expanded="false"><u>H</u>elp</button>
        <div class="menu__list" role="menu">
          <button class="menu__item" role="menuitem" data-action="help">Keyboard shortcuts</button>
          <button class="menu__item" role="menuitem" data-action="about">About Synth Player</button>
        </div>
      </div>
    </nav>

    <div class="window__body">

      <!-- Display -->
      <section class="lcd" aria-label="Дисплей">
        <div class="lcd__preset">
          <div class="lcd__legend">PRESET</div>
          <div class="lcd__preset-row">
            <button class="lcd__arrow" id="prevPreset" aria-label="Предыдущий пресет">
              <svg viewBox="0 0 16 18"><polygon points="14,1 14,17 2,9"/></svg>
            </button>
            <button class="lcd__name" id="lcdName" aria-label="Выбрать пресет">SOFT KEYS</button>
            <button class="lcd__arrow" id="nextPreset" aria-label="Следующий пресет">
              <svg viewBox="0 0 16 18"><polygon points="2,1 2,17 14,9"/></svg>
            </button>
          </div>
        </div>

        <div class="lcd__viz"><canvas class="lcd__canvas" id="viz" aria-hidden="true"></canvas></div>

        <div class="lcd__bpm">
          <div class="lcd__legend">BPM</div>
          <div class="lcd__bpm-value" id="bpm">120</div>
        </div>

        <div class="lcd__info">
          <span class="lcd__label">SYNTH</span>
          <span class="lcd__seg" role="group" aria-label="Какой синт настраивать">
            <button class="lcd__tab" id="engA" data-synth="0" aria-pressed="true">A</button>
            <button class="lcd__tab" id="engB" data-synth="1" aria-pressed="false">B</button>
          </span>
          <span class="lcd__label">POLY</span>
          <button class="lcd__chip" id="polyBtn" aria-label="Полифония">16</button>
          <span class="lcd__label">VOICE</span>
          <button class="lcd__field" id="voiceBtn" aria-label="Голос">PIANO</button>
          <span class="lcd__label">TYPE</span>
          <button class="lcd__field" id="typeBtn" aria-label="Форма волны">TRIANGLE</button>
        </div>

        <div class="lcd__meta">
          <button class="lcd__box" id="keyBtn" aria-label="Тональность лупа">KEY<b id="keyVal">C</b></button>
          <button class="lcd__box" id="chBtn" aria-label="MIDI-канал">CH<b id="chVal">ALL</b></button>
        </div>
      </section>

      <!-- Transport, volume, equalizer, effects -->
      <section class="controls">
        <div class="panel">
          <h2 class="panel__title">TRANSPORT</h2>
          <div class="transport">
            <button class="tbtn" id="playBtn" aria-label="Play">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><polygon points="6,3 21,12 6,21" fill="#2e6fd6" stroke="#174a9e" stroke-width="1"/></svg></span>
            </button>
            <button class="tbtn" id="pauseBtn" aria-label="Pause">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18" rx="1" fill="#1b2738"/><rect x="14" y="3" width="5" height="18" rx="1" fill="#1b2738"/></svg></span>
            </button>
            <button class="tbtn" id="stopBtn" aria-label="Stop">
              <span class="tbtn__disc"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="#1b2738"/></svg></span>
            </button>
          </div>
          <div class="song">
            <div class="mini-lcd" id="songName">DEMO LOOP</div>
            <button class="pill" id="songLoad">LOAD MIDI</button>
            <button class="pill" id="songDemo" hidden>DEMO</button>
          </div>
          <input type="file" id="songFile" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
        </div>

        <div class="panel">
          <h2 class="panel__title">VOLUME <b class="tag">A</b></h2>
          <div class="hfader" id="volFader">
            <div class="hfader__track"><div class="hfader__fill"></div></div>
            <div class="hfader__thumb"></div>
          </div>
          <div class="volume-scale">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            <div class="volume-scale__ticks"></div>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15 9.5a3.5 3.5 0 0 1 0 5M17.5 7a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel__title">EQUALIZER <b class="tag">A</b></h2>
          <div class="eq">
            <div class="eq__band"><div class="vfader" id="eqLow"></div><span class="eq__label">LOW</span></div>
            <div class="eq__band"><div class="vfader" id="eqMid"></div><span class="eq__label">MID</span></div>
            <div class="eq__band"><div class="vfader" id="eqHigh"></div><span class="eq__label">HIGH</span></div>
            <div class="eq__band"><div class="vfader" id="eqAir"></div><span class="eq__label">AIR</span></div>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel__title">EFFECTS <b class="tag">A</b></h2>
          <div class="knobs">
            <div class="knob-group"><div class="knob" id="knReverb"></div><span class="knob-group__label">REVERB</span></div>
            <div class="knob-group"><div class="knob" id="knTone"></div><span class="knob-group__label">TONE</span></div>
          </div>
        </div>
      </section>

      <!-- FX rack -->
      <section class="panel rack" id="rack">
        <h2 class="panel__title">FX RACK <b class="tag">A</b></h2>
        <div class="rack__grid" id="rackGrid"></div>
        <div class="fx-edit">
          <div class="fx-edit__head">
            <div class="mini-lcd" id="fxTitle">CHORUS</div>
            <button class="pill" id="fxPower" aria-pressed="false">OFF</button>
          </div>
          <div class="fx-edit__knobs" id="fxKnobs"></div>
        </div>
      </section>

      <!-- Keyboards -->
      <section class="kb kb--a is-selected" id="kbA" aria-label="Клавиатура A">
        <div class="kb__head">
          <button class="kb__select" aria-label="Настраивать синт A"><b class="kb__badge">A</b><span class="kb__preset">SOFT KEYS</span></button>
          <span class="kb__range">C4–C7</span>
          <button class="kb__oct" data-d="-1" aria-label="Октава ниже">−</button>
          <button class="kb__oct" data-d="1" aria-label="Октава выше">+</button>
        </div>
        <div class="keys has-labels"></div>
      </section>

      <section class="kb kb--b" id="kbB" aria-label="Клавиатура B">
        <div class="kb__head">
          <button class="kb__select" aria-label="Настраивать синт B"><b class="kb__badge">B</b><span class="kb__preset">ACID BASS</span></button>
          <span class="kb__range">C2–C5</span>
          <button class="kb__oct" data-d="-1" aria-label="Октава ниже">−</button>
          <button class="kb__oct" data-d="1" aria-label="Октава выше">+</button>
        </div>
        <div class="keys has-labels"></div>
      </section>
    </div>

    <!-- Power-off overlay -->
    <div class="power">
      <button class="power__btn" id="powerOn"><span>POWER ON</span></button>
    </div>
  </main>

  <!-- Help / About dialog -->
  <dialog class="dialog" id="dlg">
    <div class="dialog__title">
      <span id="dlgTitle">HELP</span>
      <button class="win-btn" id="dlgX" aria-label="Закрыть">
        <svg viewBox="0 0 14 14"><path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="dialog__body" id="dlgBody"></div>
    <div class="dialog__foot"><button class="pill" id="dlgOk">OK</button></div>
  </dialog>
</body>
</html>
